[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", "mamiferos_utm14.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]  # zip() sobre columnas del mismo DataFrame: siempre del mismo largo
